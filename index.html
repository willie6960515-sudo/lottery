<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 魔法召喚抽獎機 (實體卡專用版)</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2c3e50; --accent: #e67e22; --success: #27ae60;
            --danger: #e74c3c; --info: #3498db; --purple: #9b59b6;
            --gold: #f1c40f; --dark-wood: #3a210a; --light-wood: #8c5a2c;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Noto Sans TC', 'Segoe UI', '微軟正黑體', sans-serif;
            background: radial-gradient(circle at center, #2c1a0e 0%, #110904 100%);
            margin: 0; padding: 0; color: #fffdf5;
            user-select: none; min-height: 100vh; overflow-x: hidden;
            display: flex; flex-direction: column;
        }
        input, textarea, select { user-select: auto; font-family: inherit; }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 24px; background: rgba(0, 0, 0, 0.4);
            border-bottom: 2px solid rgba(241, 196, 15, 0.2);
            backdrop-filter: blur(8px); z-index: 100; flex-wrap: wrap; gap: 10px;
        }
        .brand-title {
            font-size: 22px; font-weight: 900; color: var(--gold);
            text-shadow: 0 2px 4px rgba(0,0,0,0.8); display: flex; align-items: center; gap: 8px;
        }
        .nav-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .tool-btn {
            border: 2px solid rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 50px;
            cursor: pointer; font-weight: 700; color: white; font-size: 14px;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: 0.2s; white-space: nowrap;
        }
        .tool-btn:hover { filter: brightness(1.15); transform: translateY(-2px); }
        .tool-btn:active { transform: translateY(0); }
        .btn-blue { background: linear-gradient(135deg, #3498db, #2980b9); }
        .btn-green { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .btn-orange { background: linear-gradient(135deg, #f39c12, #d35400); }
        .btn-purple { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
        .btn-red { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .btn-gray { background: linear-gradient(135deg, #7f8c8d, #576574); }

        .main-stage {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 20px; position: relative;
        }
        .rpg-altar {
            background-color: var(--light-wood);
            background-image: repeating-linear-gradient(0deg, transparent, transparent 24px, rgba(0,0,0,0.06) 24px, rgba(0,0,0,0.06) 48px);
            border: 8px solid #5a3514;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9), inset 0 0 50px rgba(0,0,0,0.6), 0 0 0 2px #f1c40f;
            padding: 35px 40px; border-radius: 28px; text-align: center;
            color: #fffdf5; max-width: 95%; width: 620px; position: relative;
            transition: transform 0.2s;
        }
        .altar-title {
            margin: 0; font-size: 36px; font-weight: 900; color: #fff;
            text-shadow: 0 4px 0 var(--dark-wood), 0 0 20px var(--gold); letter-spacing: 2px;
        }
        .altar-subtitle {
            color: #fdebd0; font-size: 16px; margin: 8px 0 20px 0; font-weight: bold;
            background: rgba(0,0,0,0.25); display: inline-block; padding: 4px 18px; border-radius: 20px;
        }

        .magic-circle-wrap {
            position: relative; width: 230px; height: 230px; margin: 15px auto 25px auto;
            display: flex; align-items: center; justify-content: center;
        }
        .magic-circle {
            width: 100%; height: 100%; border: 5px dashed var(--gold); border-radius: 50%;
            position: absolute; animation: spin-slow 12s linear infinite;
            box-shadow: 0 0 35px rgba(241,196,15,0.4), inset 0 0 25px rgba(241,196,15,0.3);
        }
        .magic-circle-inner {
            width: 75%; height: 75%; border: 3px solid rgba(241,196,15,0.6); border-radius: 50%;
            position: absolute; animation: spin-reverse 8s linear infinite;
        }
        .magic-star {
            font-size: 95px; color: var(--gold); text-shadow: 0 0 25px #f39c12, 0 0 45px #fff;
            animation: pulse-star 2s ease-in-out infinite alternate; z-index: 2;
        }
        @keyframes spin-slow { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
        @keyframes pulse-star { 0% { transform: scale(0.92); opacity: 0.85; } 100% { transform: scale(1.08); opacity: 1; } }
        @keyframes shake-hard {
            0%, 100% { transform: translate(0, 0) rotate(0); }
            15% { transform: translate(-12px, -6px) rotate(-4deg); }
            30% { transform: translate(12px, 6px) rotate(4deg); }
            45% { transform: translate(-12px, 6px) rotate(-4deg); }
            60% { transform: translate(12px, -6px) rotate(4deg); }
            75% { transform: translate(-8px, -4px) rotate(-2deg); }
        }

        .gacha-buttons {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px; justify-content: center; margin-top: 20px;
        }
        .btn-rpg {
            background: linear-gradient(180deg, #f39c12 0%, #d35400 100%);
            border: 4px solid #4a2508; color: white; padding: 14px 20px;
            font-size: 20px; font-weight: 900; border-radius: 16px; cursor: pointer;
            box-shadow: 0 8px 0 #6e2c00, 0 12px 20px rgba(0,0,0,0.5);
            transition: 0.1s; text-shadow: 1px 2px 3px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .btn-rpg:hover { filter: brightness(1.1); transform: translateY(-2px); box-shadow: 0 10px 0 #6e2c00, 0 15px 25px rgba(0,0,0,0.6); }
        .btn-rpg:active { transform: translateY(6px); box-shadow: 0 2px 0 #6e2c00; }
        .btn-rpg.triple {
            background: linear-gradient(180deg, #3498db 0%, #2980b9 100%);
            box-shadow: 0 8px 0 #1b4f72, 0 12px 20px rgba(0,0,0,0.5); border-color: #154360;
        }
        .btn-rpg.triple:hover { box-shadow: 0 10px 0 #1b4f72, 0 15px 25px rgba(0,0,0,0.6); }
        .btn-rpg.triple:active { box-shadow: 0 2px 0 #1b4f72; }
        .btn-rpg.epic {
            background: linear-gradient(180deg, #9b59b6 0%, #8e44ad 100%);
            box-shadow: 0 8px 0 #5b2c6f, 0 12px 20px rgba(0,0,0,0.5); border-color: #4a235a;
        }
        .btn-rpg.epic:hover { box-shadow: 0 10px 0 #5b2c6f, 0 15px 25px rgba(0,0,0,0.6); }
        .btn-rpg.epic:active { box-shadow: 0 2px 0 #5b2c6f; }
        .btn-subtext { font-size: 12px; font-weight: 700; opacity: 0.9; background: rgba(0,0,0,0.25); padding: 2px 10px; border-radius: 10px; }

        .card-result-container { margin-top: 10px; width: 100%; }
        .fancy-card {
            aspect-ratio: 54 / 90; border-radius: 14px; position: relative;
            display: flex; flex-direction: column; align-items: center;
            padding: 10px; background: white; border: 5px solid #ccc;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            animation: cardFlipIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) backwards;
            background-size: cover; background-position: center; overflow: hidden;
            flex-shrink: 0; color: #2c3e50; cursor: pointer; transition: transform 0.2s;
        }
        .fancy-card:hover { transform: scale(1.04) translateY(-5px); z-index: 20; }
        @keyframes cardFlipIn {
            0% { transform: perspective(600px) rotateY(90deg) scale(0.7); opacity: 0; }
            100% { transform: perspective(600px) rotateY(0deg) scale(1); opacity: 1; }
        }
        .fancy-card .card-id {
            position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,0.75);
            color: white; font-size: 11px; padding: 2px 7px; border-radius: 8px;
            font-weight: bold; z-index: 10;
        }
        .fancy-card .card-rarity {
            position: absolute; top: 6px; right: 6px; font-size: 11px; padding: 2px 8px;
            border-radius: 8px; border: 1px solid rgba(255,255,255,0.8);
            font-weight: 900; color: white; z-index: 10;
        }
        .fancy-card .card-icon {
            font-size: 56px; flex-grow: 1; display: flex; align-items: center;
            justify-content: center; z-index: 5; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
            margin-top: 15px;
        }
        .fancy-card .card-title {
            font-weight: 900; font-size: 16px; margin-bottom: 6px;
            text-align: center; z-index: 5; line-height: 1.2; color: #1a252f;
        }
        .fancy-card .card-desc {
            font-size: 12px; text-align: center; background: rgba(255,255,255,0.92);
            padding: 6px; border-radius: 8px; width: 100%; border: 1px dashed #95a5a6;
            z-index: 5; font-weight: bold; color: #555;
        }

        /* Rarity Themes */
        .rarity-普通 { border-color: #bdc3c7; background: linear-gradient(180deg, #ffffff 0%, #ecf0f1 100%); }
        .rarity-普通 .card-rarity { background: #7f8c8d; }
        .rarity-稀有 { border-color: #3498db; background: linear-gradient(180deg, #ebf5fb 0%, #d6eaf8 100%); box-shadow: 0 0 15px rgba(52,152,219,0.5); }
        .rarity-稀有 .card-rarity { background: #2980b9; }
        .rarity-史詩 { border-color: #9b59b6; background: linear-gradient(180deg, #f5eef8 0%, #ebdef0 100%); animation: cardFlipIn 0.5s backwards, epic-glow 1.5s infinite alternate; }
        .rarity-史詩 .card-rarity { background: #8e44ad; }
        .rarity-傳說 { border-color: #f1c40f; background: linear-gradient(180deg, #fef9e7 0%, #fcf3cf 100%); animation: cardFlipIn 0.5s backwards, legendary-glow 1.2s infinite alternate; }
        .rarity-傳說 .card-rarity { background: #d35400; }

        /* Custom Image Card Handling */
        .fancy-card.has-img { border: none; padding: 0; background: transparent; }
        .fancy-card.has-img .card-ui-img {
            width: 100%; height: 100%; object-fit: fill; border-radius: 12px;
            image-rendering: -webkit-optimize-contrast;
        }
        .fancy-card.has-img .card-id,
        .fancy-card.has-img .card-rarity,
        .fancy-card.has-img .card-icon,
        .fancy-card.has-img .card-title,
        .fancy-card.has-img .card-desc { display: none; }
        .fancy-card.has-img.rarity-稀有 { border: 3px solid #3498db; }
        .fancy-card.has-img.rarity-史詩 { border: 3px solid #9b59b6; }
        .fancy-card.has-img.rarity-傳說 { border: 4px solid #f1c40f; }

        /* 橫式卡牌 (Landscape 16:9) 自動適應樣式 */
        .fancy-card.is-landscape {
            aspect-ratio: 16 / 9;
        }
        /* 若開啟「在圖片右下角疊加效果說明」功能 */
        .fancy-card.has-img.show-overlay-desc .card-desc {
            display: flex !important; align-items: center; justify-content: center;
            position: absolute; right: 6.5%; bottom: 13%; width: 42.5%; height: 48%;
            background: transparent; border: none; color: #2c1a0e;
            font-size: clamp(12px, 1.4vw, 22px); font-weight: 900;
            line-height: 1.35; padding: 8px; text-align: center;
            word-break: break-word; z-index: 15;
        }

        @keyframes epic-glow { 0% { box-shadow: 0 0 12px #9b59b6; } 100% { box-shadow: 0 0 30px #9b59b6, 0 0 55px #8e44ad; } }
        @keyframes legendary-glow { 0% { box-shadow: 0 0 15px #f1c40f; } 100% { box-shadow: 0 0 40px #f1c40f, 0 0 80px #fff; } }

        .single-draw { display: flex; justify-content: center; align-items: center; width: 100%; height: 58vh; }
        .single-draw .fancy-card { height: 100%; width: auto; max-width: 85vw; }
        .single-draw .fancy-card.is-landscape {
            height: auto; width: min(85vw, 760px); max-height: 58vh;
        }
        .single-draw .fancy-card.is-landscape.show-overlay-desc .card-desc {
            font-size: clamp(18px, 2.4vw, 32px);
        }
        .single-draw .fancy-card .card-icon { font-size: 90px; }
        .single-draw .fancy-card .card-title { font-size: 26px; margin-bottom: 10px; }
        .single-draw .fancy-card .card-desc { font-size: 18px; padding: 12px; }

        .triple-draw {
            display: flex; justify-content: center; align-items: center; gap: 24px;
            width: 95vw; max-width: 1150px; min-height: 55vh; margin: 0 auto; flex-wrap: wrap;
        }
        .triple-draw .fancy-card { height: 48vh; max-height: 380px; width: auto; }
        .triple-draw .fancy-card.is-landscape {
            height: auto; width: min(85vw, 350px); max-height: 300px;
        }
        .triple-draw .fancy-card.is-landscape.show-overlay-desc .card-desc {
            font-size: 15px;
        }

        .multi-draw {
            display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(2, 1fr);
            gap: 2vh 1.2vw; width: 95vw; max-width: 1250px; height: 60vh; margin: 0 auto;
            justify-items: center; align-items: center;
        }
        .multi-draw .fancy-card { height: 100%; max-height: 28vh; width: auto; }
        .multi-draw .fancy-card.is-landscape {
            width: 100%; height: auto; max-height: 24vh;
        }
        .multi-draw .fancy-card.is-landscape.show-overlay-desc .card-desc {
            font-size: 11px; padding: 4px;
        }

        @media (max-width: 768px) {
            .multi-draw { grid-template-columns: repeat(2, 1fr); height: auto; max-height: 65vh; overflow-y: auto; padding: 10px; }
            .multi-draw .fancy-card { height: 220px; }
            .multi-draw .fancy-card.is-landscape { height: auto; width: 100%; }
            .triple-draw .fancy-card { height: 260px; }
            .triple-draw .fancy-card.is-landscape { height: auto; width: 90vw; }
        }
        .fancy-card.has-img .card-id,
        .fancy-card.has-img .card-rarity,
        .fancy-card.has-img .card-icon,
        .fancy-card.has-img .card-title,
        .fancy-card.has-img .card-desc { display: none; }
        .fancy-card.has-img.rarity-稀有 { border: 3px solid #3498db; }
        .fancy-card.has-img.rarity-史詩 { border: 3px solid #9b59b6; }
        .fancy-card.has-img.rarity-傳說 { border: 4px solid #f1c40f; }

        @keyframes epic-glow { 0% { box-shadow: 0 0 12px #9b59b6; } 100% { box-shadow: 0 0 30px #9b59b6, 0 0 55px #8e44ad; } }
        @keyframes legendary-glow { 0% { box-shadow: 0 0 15px #f1c40f; } 100% { box-shadow: 0 0 40px #f1c40f, 0 0 80px #fff; } }

        .single-draw { display: flex; justify-content: center; align-items: center; width: 100%; height: 58vh; }
        .single-draw .fancy-card { height: 100%; width: auto; max-width: 85vw; }
        .single-draw .fancy-card .card-icon { font-size: 90px; }
        .single-draw .fancy-card .card-title { font-size: 26px; margin-bottom: 10px; }
        .single-draw .fancy-card .card-desc { font-size: 18px; padding: 12px; }

        .triple-draw {
            display: flex; justify-content: center; align-items: center; gap: 24px;
            width: 95vw; max-width: 1000px; min-height: 55vh; margin: 0 auto; flex-wrap: wrap;
        }
        .triple-draw .fancy-card { height: 48vh; max-height: 380px; width: auto; }

        .multi-draw {
            display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(2, 1fr);
            gap: 2vh 1.2vw; width: 95vw; max-width: 1200px; height: 60vh; margin: 0 auto;
            justify-items: center; align-items: center;
        }
        .multi-draw .fancy-card { height: 100%; max-height: 28vh; width: auto; }

        @media (max-width: 768px) {
            .multi-draw { grid-template-columns: repeat(2, 1fr); height: auto; max-height: 65vh; overflow-y: auto; padding: 10px; }
            .multi-draw .fancy-card { height: 220px; }
            .triple-draw .fancy-card { height: 260px; }
        }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75); z-index: 2000; justify-content: center; align-items: center;
            backdrop-filter: blur(5px); padding: 15px;
        }
        .modal-content {
            background: #fff; color: #2c3e50; width: 100%; max-width: 960px;
            border-radius: 20px; padding: 25px; max-height: 90vh; display: flex; flex-direction: column;
            position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.5); animation: popIn 0.2s;
        }
        @keyframes popIn { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .close-icon {
            position: absolute; right: 20px; top: 18px; font-size: 28px; cursor: pointer;
            color: #95a5a6; transition: 0.2s; z-index: 10; line-height: 1; font-weight: bold;
        }
        .close-icon:hover { color: var(--danger); transform: scale(1.1); }

        .add-card-box {
            background: #f8f9fa; border: 2px solid #e9ecef; padding: 15px;
            border-radius: 12px; margin-bottom: 15px;
        }
        .add-card-grid {
            display: grid; grid-template-columns: 90px 1.2fr 1.5fr 80px 2fr auto;
            gap: 8px; align-items: center;
        }
        .card-edit-list { flex: 1; overflow-y: auto; padding-right: 5px; border: 1px solid #eee; border-radius: 10px; }
        .card-edit-row {
            display: grid; grid-template-columns: 50px 95px 1.2fr 1.5fr 70px 2fr 45px;
            gap: 8px; padding: 10px; border-bottom: 1px solid #eee; align-items: center;
            background: #fff; transition: background 0.15s;
        }
        .card-edit-row:hover { background: #fdfaf6; }
        .card-edit-row input, .card-edit-row select {
            width: 100%; padding: 7px 10px; border: 1px solid #dcdde1; border-radius: 6px; font-size: 14px;
        }
        .thumb-preview {
            width: 42px; height: 64px; border-radius: 6px; object-fit: cover;
            border: 2px solid #ddd; background: #eee; display: flex; align-items: center;
            justify-content: center; font-size: 20px; overflow: hidden; margin: 0 auto;
        }
        .thumb-preview img { width: 100%; height: 100%; object-fit: cover; }

        @media (max-width: 850px) {
            .add-card-grid, .card-edit-row { grid-template-columns: 1fr 1fr; }
        }

        /* Filter Tabs */
        .filter-bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
        .filter-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
        .filter-btn {
            padding: 6px 14px; border-radius: 20px; border: 1px solid #ddd; background: #f1f2f6;
            cursor: pointer; font-weight: bold; font-size: 13px; color: #57606f; transition: 0.2s;
        }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* Toast & Custom Confirm */
        #toast-container { position: fixed; bottom: 25px; right: 25px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast-msg {
            background: rgba(44, 62, 80, 0.95); color: white; padding: 12px 22px;
            border-radius: 12px; font-weight: bold; font-size: 14px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4); border-left: 5px solid var(--gold);
            animation: popIn 0.2s ease;
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="brand-title">
            <span>🔮</span> 魔法召喚抽獎機
            <span style="font-size:12px; background:rgba(241,196,15,0.2); color:#f1c40f; padding:2px 10px; border-radius:20px; border:1px solid rgba(241,196,15,0.4);">實體卡專用版</span>
        </div>

        <div class="nav-actions">
            <!-- Cloud Sync Status -->
            <span id="cloudStatusBadge" style="font-size:12px; color:#bdc3c7; margin-right:5px;">📦 本機儲存模式</span>
            <button id="btnLoginGoogle" class="tool-btn btn-blue" onclick="doLogin()">
                ☁️ Google 同步
            </button>
            <button id="btnLogoutGoogle" class="tool-btn btn-gray" style="display:none;" onclick="doLogout()">
                登出 (<span id="userName"></span>)
            </button>

            <button class="tool-btn btn-purple" onclick="openGallery()">📖 卡牌圖鑑 (<span id="totalCardCount">0</span>)</button>
            <button class="tool-btn btn-orange" onclick="openCardEditor()">🛠️ 新增 / 編輯品項</button>
            <button class="tool-btn btn-green" onclick="openRateEditor()">🎲 機率設定</button>
            <button class="tool-btn btn-gray" id="btnSound" onclick="toggleSound()">🔊 音效</button>
        </div>
    </header>

    <main class="main-stage">
        <!-- 召喚祭壇 -->
        <div class="rpg-altar" id="altarMain">
            <h1 class="altar-title">🌟 魔法召喚祭壇 🌟</h1>
            <div class="altar-subtitle">完成任務的勇者，請點擊下方按鈕進行召喚！</div>
            
            <div class="magic-circle-wrap">
                <div class="magic-circle"></div>
                <div class="magic-circle-inner"></div>
                <div class="magic-star">✡</div>
            </div>
            
            <div class="gacha-buttons">
                <button class="btn-rpg" onclick="doGacha(1)">
                    <span>🔮 單次召喚</span>
                    <span class="btn-subtext">抽出 1 張實體卡</span>
                </button>

            { id: 42, rarity: '普通', name: '精神獎勵卡', desc: '獲得老師與全班的熱情鼓勵', icon: '👍', imageUrl: 'https://i.postimg.cc/0jZNkDmZ/42jing-shen-jiang-li-ka.png' },
            { id: 43, rarity: '普通', name: '一節上下樓卡', desc: '單節下課自由上下樓', icon: '🪜', imageUrl: 'https://i.postimg.cc/rsgpVxx2/43yi-jie-shang-xia-lou-ka.png' },
            { id: 44, rarity: '普通', name: '一日帶念長', desc: '擔任一日帶念長', icon: '📖', imageUrl: 'https://i.postimg.cc/c1cCByj6/44yi-ri-dai-nian-zhang.png' },
            { id: 45, rarity: '普通', name: '同學神救援', desc: '指定同學幫忙代答問題一次', icon: '🤝', imageUrl: 'https://i.postimg.cc/gcKjHF56/45tong-xue-shen-jiu-yuan.png' }
        ];

        const RATES_DEFAULT = [
            { name: "普通", prob: 60 },
            { name: "稀有", prob: 30 },
            { name: "史詩", prob: 8 },
            { name: "傳說", prob: 2 }
        ];

        let appData = {
            cards: JSON.parse(JSON.stringify(CARDS_DEFAULT)),
            gachaRates: JSON.parse(JSON.stringify(RATES_DEFAULT)),
            overlayDescOnImg: false
        };

        let soundOn = true;
        let currentEditorFilter = 'ALL';
        let db = null, auth = null, user = null, isCloud = false, unsubscribeSync = null;
        const ac = new (window.AudioContext || window.webkitAudioContext)();

        window.onload = () => {
            loadLocal();
            updateCardCount();
            const chk = document.getElementById('chkOverlayDesc');
            if (chk) chk.checked = !!appData.overlayDescOnImg;
            initFirebase();
        };

        // 自動將舊版低解析度預設圖替換為最新高畫質圖網址
        function upgradeCardImages(cards) {
            if (!Array.isArray(cards)) return cards;
            cards.forEach(c => {
                const def = CARDS_DEFAULT.find(d => d.id === c.id || d.name === c.name);
                if (def) {
                    c.imageUrl = def.imageUrl;
                }
            });
            return cards;
        }

        function loadLocal() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                try {
                    const parsed = JSON.parse(raw);
                    if (parsed.cards && parsed.cards.length) {
                        appData.cards = upgradeCardImages(parsed.cards);
                    }
                    if (parsed.gachaRates && parsed.gachaRates.length) appData.gachaRates = parsed.gachaRates;
                    if (typeof parsed.overlayDescOnImg === 'boolean') appData.overlayDescOnImg = parsed.overlayDescOnImg;
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
                } catch (e) { console.error(e); }
            }
        }
        function toggleOverlayDesc(checked) {
            appData.overlayDescOnImg = checked;
            saveData(checked ? "已開啟「右下角疊加說明文字」" : "已關閉「右下角疊加說明文字」");
        }

        function checkCardOrientation(imgEl) {
            if (!imgEl || !imgEl.parentElement) return;
            if (imgEl.naturalWidth > imgEl.naturalHeight) {
                imgEl.parentElement.classList.add('is-landscape');
            } else {
                imgEl.parentElement.classList.remove('is-landscape');
            }
        }

        function saveData(msg = "已儲存設定") {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
            updateCardCount();
            if (isCloud && user && db) {
                db.collection('users').doc(user.uid).collection('gacha_standalone').doc('main_data').set(appData)
                    .then(() => showToast("☁️ " + msg + " (已同步雲端)"))
                    .catch(e => console.error("Cloud save error:", e));
            } else {
                showToast("💾 " + msg);
            }
        }

        function updateCardCount() {
            document.getElementById('totalCardCount').innerText = appData.cards.length;
        }

        function initFirebase() {
            if (typeof firebase === 'undefined') return;
            try {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                auth = firebase.auth();
                db = firebase.firestore();

                auth.onAuthStateChanged((u) => {
                    if (u) {
                        user = u; isCloud = true;
                        document.getElementById('btnLoginGoogle').style.display = 'none';
                        document.getElementById('btnLogoutGoogle').style.display = 'inline-flex';
                        document.getElementById('userName').innerText = u.displayName || '老師';
                        document.getElementById('cloudStatusBadge').innerText = '🟢 雲端即時同步中';
                        document.getElementById('cloudStatusBadge').style.color = '#2ecc71';
                        subscribeCloud();
                    } else {
                        user = null; isCloud = false;
                        document.getElementById('btnLoginGoogle').style.display = 'inline-flex';
                        document.getElementById('btnLogoutGoogle').style.display = 'none';
                        document.getElementById('cloudStatusBadge').innerText = '📦 本機儲存模式';
                        document.getElementById('cloudStatusBadge').style.color = '#bdc3c7';
                        if (unsubscribeSync) unsubscribeSync();
                    }
                });
            } catch (e) { console.error(e); }
        }

        function doLogin() {
            if (window.location.protocol === 'file:') {
                showToast("⚠️ 若要使用 Google 雲端同步，請上傳至 Netlify 開啟喔！本機可直接使用。", true);
                return;
            }
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(e => showToast("登入失敗：" + e.message, true));
        }

        function doLogout() {
            if (unsubscribeSync) unsubscribeSync();
            if (auth) auth.signOut();
            showToast("已登出雲端");
        }

        function subscribeCloud() {
            const docRef = db.collection('users').doc(user.uid).collection('gacha_standalone').doc('main_data');
            if (unsubscribeSync) unsubscribeSync();
            unsubscribeSync = docRef.onSnapshot((docSnap) => {
                if (docSnap.exists) {
                    const cloudData = docSnap.data();
                    if (cloudData.cards && cloudData.cards.length > 0) {
                        cloudData.cards = upgradeCardImages(cloudData.cards);
                        appData = cloudData;
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
                        updateCardCount();
                        const chk = document.getElementById('chkOverlayDesc');
                        if (chk) chk.checked = !!appData.overlayDescOnImg;
                        if (document.getElementById('cardEditModal').style.display === 'flex') renderEditorList();
                        if (document.getElementById('galleryModal').style.display === 'flex') renderGallery('ALL');
                    }
                } else {
                    saveData("初始化雲端卡池");
                }
            });
        }

        function sfx(type) {
            if (!soundOn) return;
            if (ac.state === 'suspended') ac.resume();
            const o = ac.createOscillator();
            const g = ac.createGain();
            o.connect(g); g.connect(ac.destination);

            if (type === 'coin') {
                o.frequency.setValueAtTime(987.77, ac.currentTime);
                o.frequency.exponentialRampToValueAtTime(1318.51, ac.currentTime + 0.12);
                g.gain.setValueAtTime(0.15, ac.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, ac.currentTime + 0.15);
                o.start(); o.stop(ac.currentTime + 0.15);
            } else if (type === 'magic') {
                o.type = 'sine';
                o.frequency.setValueAtTime(300, ac.currentTime);
                o.frequency.exponentialRampToValueAtTime(900, ac.currentTime + 0.8);
                g.gain.setValueAtTime(0.01, ac.currentTime);
                g.gain.linearRampToValueAtTime(0.2, ac.currentTime + 0.4);
                g.gain.linearRampToValueAtTime(0.01, ac.currentTime + 0.8);
                o.start(); o.stop(ac.currentTime + 0.8);
            } else if (type === 'win') {
                [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                    const osc = ac.createOscillator();
                    const gn = ac.createGain();
                    osc.type = 'triangle';
                    osc.connect(gn); gn.connect(ac.destination);
                    osc.frequency.value = f;
                    gn.gain.setValueAtTime(0.2, ac.currentTime + i * 0.09);
                    gn.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + i * 0.09 + 0.4);
                    osc.start(ac.currentTime + i * 0.09);
                    osc.stop(ac.currentTime + i * 0.09 + 0.4);
                });
            }
        }

        function toggleSound() {
            soundOn = !soundOn;
            document.getElementById('btnSound').innerText = soundOn ? '🔊 音效' : '🔇 靜音';
        }

        function showToast(msg, isWarn = false) {
            const c = document.getElementById('toast-container');
            const div = document.createElement('div');
            div.className = 'toast-msg';
            if (isWarn) div.style.borderLeftColor = '#e74c3c';
            div.innerText = msg;
            c.appendChild(div);
            setTimeout(() => div.remove(), 2600);
        }

        function showConfirm(title, desc, onOk) {
            document.getElementById('confirmTitle').innerText = title;
            document.getElementById('confirmDesc').innerText = desc;
            const okBtn = document.getElementById('confirmOkBtn');
            okBtn.onclick = () => {
                closeModal('confirmModal');
                onOk();
            };
            document.getElementById('confirmModal').style.display = 'flex';
        }

        function rollRarity(isGuaranteeEpic) {
            let rand = Math.random() * 100;
            if (isGuaranteeEpic) {
                let epicProb = appData.gachaRates.find(r => r.name === '史詩')?.prob || 8;
                let legProb = appData.gachaRates.find(r => r.name === '傳說')?.prob || 2;
                let total = epicProb + legProb;
                return (rand <= (legProb / total) * 100) ? '傳說' : '史詩';
            }
            let sum = 0;
            for (let r of appData.gachaRates) {
                sum += r.prob;
                if (rand <= sum) return r.name;
            }
            return '普通';
        }

        function buildCardUI(card, delayIndex = 0) {
            if (!card) return '';
            const styleClass = `rarity-${card.rarity}`;
            const hasImg = card.imageUrl && card.imageUrl.trim() !== '';
            const overlayClass = (hasImg && appData.overlayDescOnImg) ? 'show-overlay-desc' : '';
            const animDelay = `style="animation-delay: ${delayIndex * 0.08}s"`;
            const safeCardJson = encodeURIComponent(JSON.stringify(card));

            const imgTag = hasImg
                ? `<img src="${card.imageUrl}" class="card-ui-img" onload="checkCardOrientation(this)" onerror="this.style.display='none'; this.parentElement.classList.remove('has-img', 'is-landscape', 'show-overlay-desc')">`
                : '';

            return `
                <div class="fancy-card ${styleClass} ${hasImg ? 'has-img' : ''} ${overlayClass}" ${animDelay} onclick="zoomCard('${safeCardJson}')">
                    ${imgTag}
                    <div class="card-id">No.${card.id}</div>
                    <div class="card-rarity">${card.rarity}</div>
                    <div class="card-icon">${card.icon || '🎁'}</div>
                    <div class="card-title">${card.name}</div>
                    <div class="card-desc">${card.desc || ''}</div>
                </div>
            `;
        }

        function zoomCard(encodedCard) {
            const card = JSON.parse(decodeURIComponent(encodedCard));
            const box = document.getElementById('cardZoomContent');
            box.innerHTML = buildCardUI(card, 0);
            document.getElementById('cardZoomModal').style.display = 'flex';
            sfx('coin');
        }

        function doGacha(times) {
            if (!appData.cards || appData.cards.length === 0) {
                showToast("⚠️ 卡池目前沒有任何卡片，請先新增品項！", true);
                return;
            }

            sfx('magic');
            const altar = document.getElementById('altarMain');
            altar.style.animation = 'shake-hard 0.45s infinite';

            setTimeout(() => {
                altar.style.animation = 'none';
                altar.style.display = 'none';

                let results = [];
                for (let i = 0; i < times; i++) {
                    const isGuarantee = (times === 10 && i === 9);
                    const targetRarity = rollRarity(isGuarantee);
                    let pool = appData.cards.filter(c => c.rarity === targetRarity);
                    if (pool.length === 0) pool = appData.cards;
                    const picked = pool[Math.floor(Math.random() * pool.length)];
                    results.push(picked);
                }

                const rc = document.getElementById('gachaCardContainer');
                let layoutClass = 'single-draw';
                if (times === 3) layoutClass = 'triple-draw';
                if (times === 10) layoutClass = 'multi-draw';

                rc.className = 'card-result-container ' + layoutClass;
                rc.innerHTML = results.map((c, idx) => buildCardUI(c, idx)).join('');
                document.getElementById('gachaResult').style.display = 'block';

                const hasBigWin = results.some(c => c.rarity === '史詩' || c.rarity === '傳說');
                if (hasBigWin) sfx('win'); else sfx('coin');
            }, 900);
        }

        function resetStage() {
            document.getElementById('gachaResult').style.display = 'none';
            document.getElementById('altarMain').style.display = 'block';
            sfx('coin');
        }

        function openCardEditor() {
            renderEditorList();
            document.getElementById('cardEditModal').style.display = 'flex';
            sfx('coin');
        }

        function setEditorFilter(rarity) {
            currentEditorFilter = rarity;
            const btns = document.querySelectorAll('#editorFilterTabs .filter-btn');
            btns.forEach(b => {
                b.classList.toggle('active', b.innerText.includes(rarity) || (rarity === 'ALL' && b.innerText === '全部'));
            });
            renderEditorList();
        }

        function renderEditorList() {
            const list = document.getElementById('ceList');
            list.innerHTML = '';

            appData.cards.forEach((c, idx) => {
                if (currentEditorFilter !== 'ALL' && c.rarity !== currentEditorFilter) return;

                const row = document.createElement('div');
                row.className = 'card-edit-row';
                const thumbContent = (c.imageUrl && c.imageUrl.trim() !== '')
                    ? `<img src="${c.imageUrl}" onerror="this.outerHTML='<span>${c.icon || '🎁'}</span>'">`
                    : `<span>${c.icon || '🎁'}</span>`;

                row.innerHTML = `
                    <div class="thumb-preview" id="thumb-${idx}">${thumbContent}</div>
                    <select onchange="updateCardField(${idx}, 'rarity', this.value)">
                        <option value="普通" ${c.rarity === '普通' ? 'selected' : ''}>⚪ 普通</option>
                        <option value="稀有" ${c.rarity === '稀有' ? 'selected' : ''}>🔵 稀有</option>
                        <option value="史詩" ${c.rarity === '史詩' ? 'selected' : ''}>🟣 史詩</option>
                        <option value="傳說" ${c.rarity === '傳說' ? 'selected' : ''}>🟡 傳說</option>
                    </select>
                    <input type="text" value="${c.name}" onchange="updateCardField(${idx}, 'name', this.value)">
                    <input type="text" value="${c.desc || ''}" placeholder="效果說明" onchange="updateCardField(${idx}, 'desc', this.value)">
                    <input type="text" value="${c.icon || '🎁'}" style="text-align:center;" onchange="updateCardField(${idx}, 'icon', this.value)">
                    <input type="text" value="${c.imageUrl || ''}" placeholder="貼上圖片網址 https://..." onchange="updateCardField(${idx}, 'imageUrl', this.value)">
                    <button class="tool-btn btn-red" style="padding:6px 10px; border-radius:8px;" onclick="deleteCard(${idx})" title="刪除此品項">🗑️</button>
                `;
                list.appendChild(row);
            });
        }

        function updateCardField(index, field, value) {
            appData.cards[index][field] = value.trim();
            saveData("已更新卡牌資料");
            if (field === 'imageUrl' || field === 'icon') {
                renderEditorList();
            }
        }

        function addCard() {
            const cat = document.getElementById('ncCat').value;
            const name = document.getElementById('ncName').value.trim();
            const desc = document.getElementById('ncDesc').value.trim();
            const icon = document.getElementById('ncIcon').value.trim() || '🎁';
            const img = document.getElementById('ncImg').value.trim();

            if (!name) {
                showToast("⚠️ 請輸入品項名稱喔！", true);
                return;
            }

            const nextId = appData.cards.length > 0 ? Math.max(...appData.cards.map(c => c.id || 0)) + 1 : 1;
            appData.cards.unshift({
                id: nextId,
                rarity: cat,
                name: name,
                desc: desc,
                icon: icon,
                imageUrl: img
            });

            document.getElementById('ncName').value = '';
            document.getElementById('ncDesc').value = '';
            document.getElementById('ncImg').value = '';

            saveData(`已新增「${name}」`);
            renderEditorList();
            sfx('coin');
        }

        function deleteCard(index) {
            const target = appData.cards[index];
            showConfirm("刪除抽獎品項", `確定要刪除「${target.name}」嗎？`, () => {
                appData.cards.splice(index, 1);
                saveData(`已刪除「${target.name}」`);
                renderEditorList();
            });
        }

        function resetDefaultCards() {
            showConfirm("恢復預設卡池", "這將會把卡池重置回預設的 23 張精美卡牌，確定嗎？", () => {
                appData.cards = JSON.parse(JSON.stringify(CARDS_DEFAULT));
                appData.gachaRates = JSON.parse(JSON.stringify(RATES_DEFAULT));
                saveData("已恢復預設 23 張卡牌");
                renderEditorList();
            });
        }

        function openGallery() {
            renderGallery('ALL');
            document.getElementById('galleryModal').style.display = 'flex';
            sfx('coin');
        }

        function renderGallery(rarity) {
            const btns = document.querySelectorAll('#galleryFilterTabs .filter-btn');
            btns.forEach(b => {
                b.classList.toggle('active', b.innerText.includes(rarity) || (rarity === 'ALL' && b.innerText.includes('全部')));
            });

            const grid = document.getElementById('galleryGrid');
            const filtered = rarity === 'ALL' ? appData.cards : appData.cards.filter(c => c.rarity === rarity);
            const hasLandscape = filtered.some(c => c.imageUrl && c.imageUrl.trim() !== '');
            grid.style.gridTemplateColumns = hasLandscape
                ? 'repeat(auto-fill, minmax(210px, 1fr))'
                : 'repeat(auto-fill, minmax(145px, 1fr))';
            grid.innerHTML = filtered.map((c, i) => buildCardUI(c, i * 0.03)).join('');
        }

        function openRateEditor() {
            const container = document.getElementById('rateInputsContainer');
            container.innerHTML = '';
            appData.gachaRates.forEach((r, idx) => {
                const badgeColor = r.name === '傳說' ? '#d35400' : r.name === '史詩' ? '#8e44ad' : r.name === '稀有' ? '#2980b9' : '#7f8c8d';
                container.innerHTML += `
                    <div style="display:flex; justify-content:space-between; align-items:center; background:#f8f9fa; padding:10px 15px; border-radius:10px; border:1px solid #eee;">
                        <span style="font-weight:bold; color:${badgeColor}; font-size:16px;">${r.name}卡機率</span>
                        <div style="display:flex; align-items:center; gap:6px;">
                            <input type="number" id="rate-in-${idx}" value="${r.prob}" min="0" max="100" style="width:80px; text-align:center; font-size:16px; font-weight:bold;">
                            <span style="font-weight:bold;">%</span>
                        </div>
                    </div>
                `;
            });
            document.getElementById('rateEditModal').style.display = 'flex';
            sfx('coin');
        }

        function saveRates() {
            appData.gachaRates.forEach((r, idx) => {
                const val = parseFloat(document.getElementById(`rate-in-${idx}`).value);
                r.prob = isNaN(val) ? 0 : val;
            });
            saveData("已更新抽獎機率");
            closeModal('rateEditModal');
        }

        function exportCards() {
            const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `魔法抽獎卡池備份_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            showToast("已下載卡池備份檔");
        }

        function importCards(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.cards && Array.isArray(imported.cards)) {
                        appData.cards = imported.cards;
                        if (imported.gachaRates) appData.gachaRates = imported.gachaRates;
                        saveData("已成功匯入卡池備份！");
                        renderEditorList();
                    } else {
                        showToast("⚠️ 檔案格式不包含卡池資料", true);
                    }
                } catch (err) {
                    showToast("⚠️ 讀取備份檔失敗", true);
                }
            };
            reader.readAsText(file);
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }
    </script>
</body>
</html>
